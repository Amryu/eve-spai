[package]
name = "spai-webkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What EVE Spai's browser apps share: the page, its storage, EVE's sign-in and the characters added with scopes"
publish = false

[dependencies]
spai-core = { path = "../spai-core" }
spai-share = { path = "../spai-share" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ehttp = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Location", "History", "Storage"] }
