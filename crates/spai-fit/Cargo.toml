[package]
name = "spai-fit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EVE Spai's fitting engine: EVE's dogma rules over its static data, free of UI and I/O so the web app can share it"

[lib]
name = "spai_fit"
path = "src/lib.rs"

[[bin]]
name = "spai-fit-bake"
path = "src/bin/spai-fit-bake.rs"
required-features = ["bake"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
flate2 = "1"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# The synthetic dataset the engine tests use, for the UI crates' tests and scenes.
test-support = []
# Reading EVE's JSONL static-data zip into a dataset: native only, the web gets the baked blob.
bake = ["dep:zip", "dep:sha2"]
