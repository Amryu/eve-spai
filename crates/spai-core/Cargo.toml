[package]
name = "spai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EVE Spai's universe, wormhole and routing model, free of UI and I/O so the web app can share it"

[lib]
name = "spai_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
emath = "0.34"
ecolor = "0.34"

[features]
# Helpers the app's tests build fixtures with.
test-support = []
