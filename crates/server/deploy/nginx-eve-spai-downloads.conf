# EVE Spai release mirror (release-mirror.sh): nginx location snippet.
#
# PASTE inside the existing server { ... } for eve-spai.com, beside the static `location /`. These
# need the same `root` as the static site: if it is set inside `location /` rather than at server
# level, copy that `root` line into each block below.
#
# The files have no extension, so each gets its real name as a download and is never cached stale:
# a new release replaces them in place.

location = /windows/current {
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="eve-spai-windows-x86_64.exe"' always;
    add_header Cache-Control "no-cache" always;
}
location = /macos/current {
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="eve-spai-macos-aarch64"' always;
    add_header Cache-Control "no-cache" always;
}
location = /linux/current {
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="eve-spai-linux-x86_64"' always;
    add_header Cache-Control "no-cache" always;
}
location ~ ^/(windows|macos|linux)/current\.json$ {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
}
