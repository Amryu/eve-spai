[package]
name = "eve-spai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EVE Spai — a lean EVE Online intel tool"

[[bin]]
name = "eve-spai"
path = "src/main.rs"

[features]
default = []
# Kept as an alias so `--features fc-rescue` in anyone's muscle memory, scripts or CI still works.
# The rescue is not a separate feature any more: a rescue is a fleet, its ping comes from a fleet
# preset and its tracking hands over to the fleet tab, so nothing gates on this name.
fc-rescue = ["fleet"]
# Fleet command: the GSF dashboard mirror, and the FC-only delve911 capital rescue that runs on it.
# Off by default, because both are Imperium-specific and talk to services a stock build has no
# business knowing about. Build with `cargo build --features fleet`. Writes are a dry run until the
# user signs in and turns them on. CI's cross-check passes --all-features so the gated code and its
# tests keep compiling.
fleet = []
# Signing in to that dashboard for real. Separate from `fleet`, and its crates optional, because on
# Linux it is the only dependency in this file that needs system libraries (gtk3 and
# webkit2gtk-4.1): the dashboard authenticates with a session cookie minted by an OIDC redirect
# that lands on its own origin, so the cookie has to come out of a browser engine we drive. Windows
# and macOS use the engine the OS ships, so they need nothing installed and `--all-features` on
# those runners compiles it.
# Build with `cargo build --features fleet-auth`.
fleet-auth = ["fleet", "dep:wry", "dep:tao", "dep:webkit2gtk"]

# Embed the Windows application icon into the .exe (build.rs). winresource is pure Rust and
# compiles on every host; build.rs only invokes it for a Windows *target*, so non-Windows builds
# are unaffected.
[build-dependencies]
winresource = "0.1"

[dependencies]
br-core = { path = "../crates/br-core" }
eframe = "0.34"
egui = "0.34"
egui_extras = { version = "0.34", default-features = false, features = ["http", "image"] }
egui-phosphor = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
anyhow = "1"
winit = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "net", "io-util", "sync"] }
xmpp = { version = "0.7", default-features = false, features = ["ring", "starttls", "rustls-native-certs", "escape-hatch"] }
sasl = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots", "json", "form"] }
csv = "1"
tiny_http = "0.12"
open = "5"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.2"
keyring = "4"
# Already in the tree as rustls's crypto provider, so taking it directly costs no build time. Used
# for the encrypted fallback when the OS keychain is unavailable (see `sealed.rs`): AEAD and a KDF
# from a reviewed implementation rather than anything hand-rolled.
ring = "0.17"
notify-rust = "4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# gzip the battle-report JSON before uploading to the sharing server (Content-Encoding: gzip).
flate2 = "1"
arboard = { version = "3", default-features = false }
# Native open/save file dialogs for the battle-report JSON import/export. xdg-portal backend
# (pure Rust, via the XDG desktop portal) so Linux needs no GTK system libs; matches the tree's
# async-io/zbus ecosystem.
rfd = "0.15"
# Cross-platform advisory file locks for the single-instance guard (main.rs). Default
# `sync` feature only — operates on std::fs::File, no extra runtime deps.
fs4 = "1.1.0"
# Pairing QR for the web view. Default features off: `image` would pull an encoder this never needs,
# since the code is rasterised straight into an egui texture.
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
# Headless UI harness: renders any egui surface to a PNG and drives hover/click through the
# AccessKit tree. Version-locked to egui/eframe 0.34. No `snapshot` feature (we inspect the
# PNGs rather than diff goldens) and no `eframe` feature, which would flip `eframe/wgpu` and
# change the renderer the Linux/macOS binary is built with.
egui_kittest = { version = "0.34", features = ["wgpu"] }

# The fleet sign-in webview, behind `fleet-auth`, on the three platforms wry has an engine for:
# WebKitGTK on Linux, WebView2 on Windows, WKWebView on macOS. It runs in a subprocess
# (`--fleet-login`), since the webview wants an event loop of its own on the main thread and the
# app's is winit under eframe. Windows and macOS need nothing installed to build it; WebView2 ships
# with Windows 10 and 11, and WKWebView with macOS.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.52", optional = true }
tao = { version = "0.34", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# async-io (not tokio) to match accesskit/zbus in the rest of the tree — avoids
# forcing zbus into tokio mode (which breaks keyring/notify-rust at runtime).
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# The Unity LauncherEntry broadcast that puts the unread count on the taskbar entry (see
# `launcher.rs`). Already in the tree via accesskit and ashpd with exactly these features, so this
# changes no resolution — in particular it does not pull zbus into tokio mode, which is what breaks
# keyring and notify-rust at runtime.
zbus = "5"
# The Linux half of the fleet sign-in webview, behind `fleet-auth`: wry's engine here is WebKitGTK,
# so building it wants gtk3 and webkit2gtk-4.1 development packages, and a binary linked against
# them will not start without them. Named in wry's own public API (`WebViewExtUnix::webview` returns
# a `webkit2gtk::WebView`), so this is not a second engine, it is the handle wry hands back, and it
# is what turns off the cookie blocking that broke the sign-in. Pinned to the exact version wry
# resolves or the two sets of types do not match.
webkit2gtk = { version = "=2.0.1", optional = true }

# Windows: also build the wgpu backend. OpenGL/glow can't get its per-pixel alpha
# DWM-composited on Windows (transparent windows render as an opaque square), but wgpu
# (DX12) picks a PreMultiplied composite-alpha surface and does it correctly. The renderer
# is switched to wgpu on Windows in main.rs; Linux/macOS stay on glow.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.34", features = ["wgpu"] }

# System tray on Windows + macOS (Linux uses ksni above). Created on the main thread and
# driven through the winit/eframe event loop.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.19"
