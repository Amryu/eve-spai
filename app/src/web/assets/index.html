<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EVE Spai</title>
<link rel="stylesheet" href="/api/theme.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/panes-intel.css">
<link rel="stylesheet" href="/assets/panes-alerts.css">
<link rel="stylesheet" href="/assets/panes-pings.css">
<link rel="stylesheet" href="/assets/layout.css">
<link rel="stylesheet" href="/assets/map.css">
<link rel="stylesheet" href="/assets/dialogs.css">
</head>
<body>
<header id="bar">
  <span class="brand">EVE SPAI</span>
  <nav id="tabs"></nav>
  <button id="sheet" aria-label="Layout"></button>
  <span id="sound" class="soundbar"></span>
  <span id="status" class="status" data-state="connecting">connecting</span>
</header>
<!-- One section per pane, declared here so each pane ticket owns its own file and none of them
     have to edit this one. WEB-010 decides how they are arranged. -->
<main id="panes">
  <section class="pane" data-pane="intel" aria-label="Intel"></section>
  <section class="pane" data-pane="alerts" aria-label="Alerts"></section>
  <section class="pane" data-pane="pings" aria-label="Fleet pings"></section>
  <section class="pane" data-pane="map" aria-label="Map"></section>
</main>
<!-- The first snapshot, spliced in by the server so the page paints without a second round trip.
     Escaped on the way in: this carries EVE chat verbatim. -->
<script type="application/json" id="boot">"__BOOT__"</script>
<!-- The icon map, inlined so the first paint has its glyphs instead of painting twice. -->
<script type="application/json" id="icons">"__ICONS__"</script>
<script type="module" src="/assets/app.js"></script>
<script type="module" src="/assets/panes-intel.js"></script>
<script type="module" src="/assets/panes-alerts.js"></script>
<script type="module" src="/assets/panes-pings.js"></script>
<script type="module" src="/assets/map.js"></script>
<script type="module" src="/assets/dialogs.js"></script>
<script type="module" src="/assets/sound.js"></script>
<script type="module" src="/assets/layout.js"></script>
</body>
</html>
