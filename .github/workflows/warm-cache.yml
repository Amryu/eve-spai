name: Warm release cache

# A tag build can restore caches only from the default branch, so this builds the release targets on
# `main` with release.yml's cache key. Runs when Cargo.lock changes, weekly so the cache is not
# evicted, or on demand.
on:
  push:
    branches: [main]
    paths: ["Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  # Must be `build`, like release.yml: rust-cache puts `github.job` in the cache key.
  build:
    name: Warm ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Same key as release.yml so the cache this saves on `main` is the one the tag build restores.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # winit/egui need X11 + Wayland dev libs to link on Linux (mirrors release.yml).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libdbus-1-dev pkg-config

      - name: Build (populate cache)
        run: cargo build --release --target ${{ matrix.target }}
