name: Cross check

# Run the test suite on Linux, and compile-check the platform-specific code (tray, autostart, window
# helpers) on Windows and macOS, which can't be built on the Linux dev machine.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-features so the sign-in webview keeps compiling against the engine each OS ships.
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/server
      # winit/egui need X11 + Wayland dev libs to link on Linux (mirrors release.yml).
      # The gtk and webkit lines are this job only, deliberately out of sync with release.yml and
      # warm-cache.yml: only --all-features turns on `fleet-auth`, and only `fleet-auth` links the
      # sign-in webview. Do not "fix" the other two by adding these; they build default features
      # and would pull several hundred MB of apt for nothing. The Windows and macOS jobs compile
      # the same webview against the engine their OS ships, so they need nothing installed.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libdbus-1-dev pkg-config \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev
      - name: cargo test (all features)
        run: cargo test --workspace --all-features
      - name: cargo test (default features)
        run: cargo test --workspace
      # The battle report server is its own workspace, so nothing above builds it.
      - name: Server crate
        run: cargo test --manifest-path crates/server/Cargo.toml

  # The web app builds on these crates, so they must keep compiling for the browser.
  wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32)
        run: cargo check -p spai-core -p spai-share -p spai-ui -p spai-web --target wasm32-unknown-unknown

  # The web map as it is deployed: a trunk release build, wasm-opt included.
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: |
          curl -sSfL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin trunk
      - name: trunk build
        working-directory: crates/spai-web
        run: trunk build --release --public-url /wh/
