name: FC build

# The same binaries as release.yml, built with the FC features on, for handing to FCs directly.
# Manual only, and never a release: releases are built without `fleet` so a public download never
# carries fleet command. The binaries land as workflow artifacts that expire.
#
# Run it from the Actions tab, or: gh workflow run fc-build.yml -f features=fleet-auth
on:
  workflow_dispatch:
    inputs:
      features:
        description: "fleet-auth signs in to the dashboard from the app; fleet is everything else without the sign-in webview (and on Linux, without the webkit runtime dependency)"
        type: choice
        options: [fleet-auth, fleet]
        default: fleet-auth
      retention:
        description: "Days to keep the binaries"
        type: number
        default: 7

# Read-only on purpose: without contents: write this workflow cannot create a release or a tag, so
# nothing here can publish by accident.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} (${{ inputs.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest, as in release.yml: its older glibc is what lets the binary
          # start on most distros.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore only, as in release.yml: saving from a manual run could LRU-evict the default-branch
      # cache that warm-cache.yml fills.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: false

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libdbus-1-dev pkg-config

      # Only the sign-in webview needs these, and only on Linux: Windows and macOS build against
      # the engine the OS ships.
      - name: Install Linux webview deps
        if: runner.os == 'Linux' && inputs.features == 'fleet-auth'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --features ${{ inputs.features }}

      # The commit and the features in the name, so a binary handed on says what it is.
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/eve-spai${{ matrix.ext }}" \
             "dist/eve-spai-fc-${{ matrix.name }}${{ matrix.ext }}"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: eve-spai-fc-${{ matrix.name }}-${{ inputs.features }}-${{ env.SHORT_SHA }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention }}
