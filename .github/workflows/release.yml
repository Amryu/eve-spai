name: Release

# Build release binaries and publish a GitHub Release when a v* tag is pushed. A manual run builds
# the binaries without publishing, which is a way to try the release build before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases + upload assets

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore only: a tag build can read only the default-branch cache that warm-cache.yml fills,
      # and its own tag-scoped save could LRU-evict that cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: false

      # winit/egui need X11 + Wayland dev libs to link on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libdbus-1-dev pkg-config \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev
          # gtk and webkit only for the second binary, the fleet sign-in helper: the app itself is
          # built without `fleet-auth` so it starts on machines that have neither.

      # Cargo.toml is the source of truth, so a mismatched tag fails the build instead of rewriting it.
      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(perl -0ne 'print $1 if /\[workspace\.package\][^\[]*?version = "([^"]+)"/s' Cargo.toml)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO. Bump Cargo.toml to $TAG and commit before tagging."
            exit 1
          fi
          echo "Version $CARGO matches tag v$TAG."

      # Windows and macOS carry the sign-in webview in the app: their browser engine ships with the
      # OS. Linux builds the app without it, then the same source again with it, as the helper.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }} --features fleet-auth
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/eve-spai${{ matrix.ext }}" \
             "dist/eve-spai-${{ matrix.name }}${{ matrix.ext }}"

      - name: Build the Linux sign-in helper
        if: runner.os == 'Linux'
        run: |
          cargo build --release --target ${{ matrix.target }} --features fleet-auth
          cp "target/${{ matrix.target }}/release/eve-spai" "dist/eve-spai-fleet-login-${{ matrix.name }}"

      - uses: actions/upload-artifact@v6
        with:
          name: eve-spai-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
