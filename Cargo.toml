[workspace]
members = ["app", "crates/br-core", "crates/spai-core", "crates/spai-share", "crates/spai-ui", "crates/spai-assets", "crates/spai-web"]
resolver = "2"

[workspace.package]
version = "0.13.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/Amryu/eve-spai"

# Tuned for a small release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind, not abort: a panic on a background thread (the log watcher parsing an odd chat line, a
# sound/jabber worker) must not take the whole app down, and catch_unwind only works under unwind.
panic = "unwind"
